# ---MLP Networks---
actor_network:
  pre_torso:
    _target_: mava.networks.torsos.MLPTorso
    layer_sizes: [256, 256, 256, 256]
    use_layer_norm: False
    activation: relu

critic_network:
  pre_torso:
    _target_: mava.networks.torsos.MLPTorso
    layer_sizes: [256, 256, 256, 256]
    use_layer_norm: False
    activation: relu
