# --- GliderMA Environment Config ---
defaults:
  - _self_
  - scenario: glider_default

env_name: GliderMA  # Environment ID for JaxMARL registration

# Defines the metric that will be used to evaluate the performance of the agent.
eval_metric: episode_return

implicit_agent_id: False
log_win_rate: False

kwargs:
  num_agents: 1 # Number of gliders
  max_steps_in_episode: 200  # Maximum steps per episode
  history_seconds: 8  # History buffer size in seconds
  
  # Physical constants
  g: 9.81
  rho: 1.225
  mass: 5.0
  wingspan: 2.5
  aspect_ratio: 16.0
  
  # Operational bounds
  horizontal_bound: 5000.0
  initial_altitude: 500.0
  initial_speed: 10.0
  initial_spawn_radius: 10.0
  
  # Multi-agent specific
  collision_distance: 50.0  # Minimum distance between agents
  collision_penalty: -100.0
  
  # Reward shaping
  vertical_speed_weight: 1.0
  speed_penalty_weight: 0.01
